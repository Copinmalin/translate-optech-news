name: Weekly latest FR newsletter review

run-name: >-
  ${{ github.event_name == 'pull_request_review'
      && format('Publish reviewed PR #{0}', github.event.pull_request.number)
      || 'Prepare latest newsletter for review' }}

on:
  schedule:
    # 18:15 UTC reste apres 18 h en France, ete comme hiver.
    - cron: "15 18 * * 5"
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-fr-newsletter-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-review:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4

    steps:
      - name: Checkout tooling repository
        uses: actions/checkout@v6

      - name: Checkout French fork
        uses: actions/checkout@v6
        with:
          repository: Copinmalin/bitcoinops.github.io
          ref: master
          path: target_repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Identify the latest newsletter
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import optech_fr

          url = optech_fr.resolve_latest_newsletter_url()
          print(f"url={url}")
          print(f"filename={optech_fr.slug_from_en_url(url)}.md")
          PY

      - name: Check whether a translation already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          path="target_repo/_posts/fr/newsletters/${{ steps.latest.outputs.filename }}"
          if [ -f "$path" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La traduction existe deja: $path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate the latest newsletter
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python optech_fr_linkresolver3.py "${{ steps.latest.outputs.url }}" \
            --model "$OPENAI_MODEL" \
            --output-dir review-output \
            --overwrite

      - name: Repair internal links
        if: steps.existing.outputs.exists == 'false'
        env:
          PYTHONPATH: .
        run: |
          python tools/repair_fr_links.py \
            --mode apply \
            --target review-output

      - name: Read newsletter metadata
        if: steps.existing.outputs.exists == 'false'
        id: newsletter
        shell: bash
        run: |
          set -euo pipefail
          FILE="review-output/_posts/fr/newsletters/${{ steps.latest.outputs.filename }}"
          test -f "$FILE"
          python - "$FILE" <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          match = re.search(r"^title:\s*['\"]?.*?#(\d+)", text, re.MULTILINE)
          if not match:
              raise SystemExit(f"Numero de newsletter introuvable dans {path}")
          print(f"number={match.group(1)}")
          PY

      - name: Upload review artifact
        if: steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: newsletter-${{ steps.newsletter.outputs.number }}-fr-review
          path: review-output/_posts/fr/newsletters/${{ steps.latest.outputs.filename }}
          if-no-files-found: error

      - name: Open the draft review pull request
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSLETTER_NUMBER: ${{ steps.newsletter.outputs.number }}
          NEWSLETTER_FILE: ${{ steps.latest.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json title,number \
            --jq ".[] | select(.title == \"[Relecture] Newsletter ${NEWSLETTER_NUMBER} en francais\") | .number" \
            | head -n 1)
          if [ -n "$existing_pr" ]; then
            echo "Une PR de relecture existe deja: #$existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p review/newsletters
          cp "review-output/_posts/fr/newsletters/$NEWSLETTER_FILE" "review/newsletters/$NEWSLETTER_FILE"

          branch="review/newsletter-${NEWSLETTER_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "review/newsletters/$NEWSLETTER_FILE"
          git commit -m "Prepare newsletter ${NEWSLETTER_NUMBER} for French review"
          git push --set-upstream origin "$branch"

          body=$(cat <<EOF
          La traduction francaise de la newsletter ${NEWSLETTER_NUMBER} est prete a relire.

          1. Relire et corriger le fichier \`review/newsletters/${NEWSLETTER_FILE}\` dans cette PR.
          2. Passer la PR de brouillon a **Ready for review**.
          3. Soumettre une review **Approve** pour publier automatiquement la PR vers \`bitcoinops/bitcoinops.github.io\`.

          Ne pas fusionner cette PR : elle sera fermee automatiquement apres la publication amont.

          Source : ${{ steps.latest.outputs.url }}
          Run : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --draft \
            --title "[Relecture] Newsletter ${NEWSLETTER_NUMBER} en francais" \
            --body "$body" \
            --reviewer Copinmalin

  publish-reviewed:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'Copinmalin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'review/newsletter-')
    runs-on: ubuntu-latest

    steps:
      - name: Require the cross-repository token
        env:
          BITCOINOPS_REPO_TOKEN: ${{ secrets.BITCOINOPS_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$BITCOINOPS_REPO_TOKEN" ]; then
            echo "::error::Le secret BITCOINOPS_REPO_TOKEN est requis pour publier dans le fork puis ouvrir la PR amont."
            exit 1
          fi

      - name: Checkout the approved review
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout French fork
        uses: actions/checkout@v6
        with:
          repository: Copinmalin/bitcoinops.github.io
          ref: master
          path: target_repo
          token: ${{ secrets.BITCOINOPS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Publish the reviewed translation
        id: publish
        env:
          GH_TOKEN: ${{ secrets.BITCOINOPS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find review/newsletters -maxdepth 1 -type f -name '*-newsletter.md' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::La PR de relecture doit contenir exactement une newsletter, trouve: ${#files[@]}."
            exit 1
          fi

          source_file="${files[0]}"
          filename=$(basename "$source_file")
          number=$(python - "$source_file" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r"^title:\s*['\"]?.*?#(\d+)", text, re.MULTILINE)
          if not match:
              raise SystemExit("Numero de newsletter introuvable")
          print(match.group(1))
          PY
          )

          target="target_repo/_posts/fr/newsletters/$filename"
          if [ -e "$target" ]; then
            echo "::error::Le fichier existe deja sur master: $target"
            exit 1
          fi

          branch="Newsletter-${number}-translate-in-French"
          if git -C target_repo ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::La branche origin/$branch existe deja; publication interrompue pour ne rien ecraser."
            exit 1
          fi

          cp "$source_file" "$target"
          git -C target_repo config user.name "Copinmalin"
          git -C target_repo config user.email "4174888+Copinmalin@users.noreply.github.com"
          git -C target_repo checkout -b "$branch"
          git -C target_repo add "_posts/fr/newsletters/$filename"
          git -C target_repo commit -m "Create $filename"
          git -C target_repo push --set-upstream origin "$branch"

          pr_url=$(gh pr create \
            --repo bitcoinops/bitcoinops.github.io \
            --base master \
            --head "Copinmalin:$branch" \
            --title "Newsletter ${number} translate in French" \
            --body "")

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "PR amont creee : $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Close the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Relecture validee. PR amont publiee : ${{ steps.publish.outputs.pr_url }}"
